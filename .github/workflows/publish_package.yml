name: Publish Python package

# A push of a tag v*.*.* builds, tests and publishes the package. A manual
# run (workflow_dispatch, on any branch or tag) runs the same jobs, including
# the tests of the built wheels, but not the upload to PyPI (see upload_all).

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:

jobs:
  test_package:
    uses: ./.github/workflows/test_package.yml

  make_sdist:
    needs: test_package
    name: Make source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel pybind11 lark

      - name: Build SDist
        env:
          INSTALL_ENDF_PARSERPY_CPP: no
        run: python setup.py sdist

      - name: Show built wheels
        run: ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build_wheels:
    needs: make_sdist
    name: Build wheels on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 500

    strategy:
      fail-fast: true
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
          - macos-15-intel
          # Apple Silicon: the current image, so that the job does not fail
          # when a pinned image is retired (as macos-14 was); the oldest macOS
          # supported by the wheels is set by cibuildwheel's deployment target,
          # not by the image
          - macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel==3.3.1

      # cibuildwheel installs every wheel into a fresh environment and
      # checks it: the package imports from that environment, and all C++
      # modules import and select a row kernel tier that is built and
      # supported. For the wheels that no job of test_wheels installs
      # (musllinux, win32, Python versions other than 3.12 and 3.14) this
      # is the only test.
      - name: Build wheels
        env:
          INSTALL_ENDF_PARSERPY_CPP: yes
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_BUILD_VERBOSITY: 3
          CIBW_TEST_COMMAND: python {project}/tools/check_installed_package.py --not-under {project}
        run: |
          python cibuildhack.py
          python -m cibuildwheel --output-dir wheelhouse

      - name: Show built wheels on Linux and macOS
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: ls -lh wheelhouse/

      - name: Show built wheels on Windows
        if: runner.os == 'Windows'
        run: dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.runner }}
          path: wheelhouse/*.whl

  # The tests of test_package.yml against the built wheels: each runner
  # and Python version of its matrix installs the wheel built for it.
  test_wheels:
    needs: build_wheels
    uses: ./.github/workflows/test_package.yml
    with:
      wheels: true

  # Only for a pushed tag v*.*.*, never in a manual run.
  upload_all:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - test_package
      - make_sdist
      - build_wheels
      - test_wheels

    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
